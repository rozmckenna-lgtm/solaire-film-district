name: Preserve approved cinematic globe asset
on:
  push:
    paths:
      - '.github/workflows/preserve-cinematic-globe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mirror identical approved image bytes without replacing artwork
        run: |
          set -euo pipefail
          mkdir -p preview/assets
          curl --fail --location --retry 2 --max-time 35 --silent --show-error 'https://media.base44.com/images/public/6ad768462ea55ab133e15a41/fd49a2c7f_generated_image.png' -o preview/assets/approved-cinematic-globe.png
          python - <<'PY'
          from pathlib import Path
          p=Path('preview/assets/approved-cinematic-globe.png')
          b=p.read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n' and len(b)>20000, 'Invalid globe image; refuse commit'
          print('Verified approved PNG asset, bytes:',len(b))
          PY
      - name: Commit identical source image to staging assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/assets/approved-cinematic-globe.png
          git diff --cached --quiet || (git commit -m 'Preserve identical approved cinematic globe asset [skip ci]' && git push)
